<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>CADup</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#162335;background:#f8fafc;font-synthesis:none}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;min-height:0}button{font:inherit;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.55;cursor:default}button[hidden]{display:none!important}
header{flex:0 0 auto;padding:max(8px,env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid #dde4ec}
.brand{min-width:0;flex:1;line-height:1.16}.brand strong{display:block;font-size:16px;letter-spacing:-.4px}.brand span{display:block;color:#68788d;font-size:11px;margin-top:3px}
.small{height:38px;min-width:39px;border:1px solid #dde4ec;border-radius:11px;background:#f8fafc;color:#24354c;font-size:20px;font-weight:600}
canvas{display:block;flex:1;min-height:0;width:100%;background:#e9eef3;touch-action:none;outline:none;cursor:crosshair}
footer{background:#fff;border-top:1px solid #dde4ec;padding:10px 12px max(11px,env(safe-area-inset-bottom));flex:0 0 auto}
.mode-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:9px}
.tool{height:42px;border:1px solid #cbd5e1;border-radius:11px;color:#37516c;background:#f2f6fa;font-size:14px;font-weight:650}
.tool.active{background:#dbeafe;border-color:#2563eb;color:#164c91;box-shadow:inset 0 0 0 1px #2563eb}
.statusline{min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px}
.status{font-size:12px;font-weight:600;color:#2e4c6c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secondary{font-size:12px;color:#66788e;margin-bottom:7px}.cancel{border:0;color:#1d5da5;background:#eff6ff;border-radius:8px;padding:7px 9px;font-size:12px;font-weight:650;white-space:nowrap}
.controls{display:flex;gap:6px}.controls button{height:40px;border:1px solid #dbe2eb;border-radius:10px;background:#f2f6fb;color:#1a456d;font-size:12px;font-weight:650;padding:0 12px}
#toggleWalls{margin-right:auto;min-width:44px;padding:0 9px;display:flex;align-items:center;justify-content:center;color:#15803d;background:#ecfdf5;border-color:#22c55e}
#toggleWalls svg{width:26px;height:26px;display:block}#toggleWalls .wall-off{display:none}
#toggleWalls[aria-pressed="false"]{color:#94a3b8;background:#f1f5f9;border-color:#ef4444}
#toggleWalls[aria-pressed="false"] .wall-off{display:block;stroke:#dc2626}#minus,#plus{font-size:21px;min-width:40px;padding:0}#clearAll{color:#a52835;background:#fff1f2}#clearAll.armed{color:#fff;background:#b91c1c}
@media(max-width:360px){header{padding-inline:8px}.brand span{font-size:9px}footer{padding-inline:8px}.controls{gap:4px}.controls button{padding-inline:8px}.tool{font-size:12px}}
header{flex-wrap:nowrap;padding:4px 10px;min-height:36px;gap:6px;position:relative;z-index:10}.brand strong{font-size:13px}
.top-menu{position:relative;flex:none}.top-menu summary{font-size:12px;font-weight:650;cursor:pointer;list-style:none;padding:6px 8px;border:1px solid #cbd5e1;border-radius:7px;background:#f2f6fb}.top-menu summary::-webkit-details-marker{display:none}
.menu-panel{position:absolute;right:0;top:calc(100% + 6px);display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(280px,calc(100vw - 20px));padding:8px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 8px 24px #16233526}
.file-action{min-height:38px;padding:6px 9px;border:1px solid #cbd5e1;border-radius:9px;background:#f2f6fb;color:#1a456d;font-size:12px;font-weight:650}
header #toggleWalls{margin:0;width:32px;height:28px;min-width:32px;border:1px solid #22c55e;border-radius:7px;padding:2px 4px}header #toggleWalls svg{width:22px;height:22px}header{padding-top:max(4px,env(safe-area-inset-top))}
footer{padding:5px 8px max(5px,env(safe-area-inset-bottom))}.mode-row{display:flex;gap:6px;margin:0}.mode-row .tool{flex:1;height:36px;border-radius:8px}
.mode-row #toggleWalls{margin:0;flex:0 0 38px;min-width:38px;height:36px;padding:4px;border:1px solid #22c55e;border-radius:8px}.mode-row #drawMode{flex:0 0 38px}.mode-row #drawMode svg{display:block;width:22px;height:22px;margin:auto}.cancel{padding:5px 9px}.cancel[hidden]{display:none}.status{display:block;margin-top:4px}.status[hidden]{display:none}
.top-action{flex:none;width:30px;height:28px;padding:0;border:1px solid #cbd5e1;border-radius:7px;background:#f2f6fb;color:#24354c;font-size:20px}

.wall-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:5px;margin-bottom:6px;padding:6px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:10px}.wall-actions[hidden]{display:none}.wall-actions button{min-height:36px;padding:5px 7px;border:1px solid #bfdbfe;background:#fff;border-radius:7px;color:#1e40af;font:inherit;font-size:11px;font-weight:650}
.wall-actions{display:block;padding:6px}.dimension-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px;align-items:end}.dimension-fields label{font-size:10px;font-weight:650;color:#1e40af;min-width:0}.dimension-fields input{display:block;width:100%;min-width:0;margin-top:3px;padding:7px 5px;border:1px solid #93c5fd;border-radius:7px;background:#fff;color:#162335;font:inherit;font-size:16px}.dimension-fields button{padding-inline:6px}#dimensionError{margin:5px 0 0;font-size:11px;color:#b91c1c}#dimensionError:empty{display:none}
.mode-row[hidden]{display:none}.wall-actions{margin-bottom:0}
.footer-row{display:flex;align-items:flex-end;gap:6px}.footer-row .mode-row{flex:0 0 auto}.footer-row .wall-actions{flex:1;min-width:0}.footer-row .dimension-fields{gap:3px;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) 28px}.footer-row .dimension-fields label{font-size:9px}.footer-row .dimension-fields button{padding-inline:4px}.footer-row .wall-actions{padding:4px}
header{flex-wrap:wrap}header #mainTools{display:flex;flex:0 0 auto;gap:4px;margin:0}header #mainTools #toggleWalls,header #mainTools #drawMode{flex:0 0 32px;width:32px;min-width:32px;height:28px;margin:0;padding:3px;border-radius:7px}header #mainTools svg{width:22px;height:22px}header .wall-actions{flex:0 0 100%;min-width:0;margin:0;padding:4px}.top-menu summary{padding:5px 8px}header .status{flex:0 0 100%;margin:0}
.menu-panel #reloadApp{grid-column:1 / -1}
footer[hidden]{display:none}#editorFooter .wall-actions{margin:0}
#editorFooter{position:fixed;left:0;right:0;bottom:0;z-index:20;box-shadow:0 -3px 16px #1623351a;padding-bottom:max(5px,env(safe-area-inset-bottom))}#editorFooter[hidden]{display:none}

.object-menu{flex:none}.object-menu>summary{display:flex;align-items:center;justify-content:center;list-style:none;width:32px;height:28px;padding:3px;border:1px solid #cbd5e1;border-radius:7px;color:#1e40af;background:#f2f6fb;cursor:pointer}.object-menu>summary::-webkit-details-marker{display:none}.object-menu>summary svg{width:22px;height:22px}.object-menu[open]>summary{background:#dbeafe;border-color:#2563eb}
.object-library{position:fixed;left:8px;top:max(42px,calc(env(safe-area-inset-top) + 38px));width:min(340px,calc(100vw - 16px));max-height:65dvh;overflow:auto;padding:8px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 8px 24px #16233526;z-index:30}.catalog-category>summary{font-size:13px;font-weight:700;padding:10px 6px;cursor:pointer}.catalog-subcategory{margin:0 0 3px 10px}.catalog-subcategory>summary{font-size:12px;padding:8px 5px;cursor:pointer}.catalog-items{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px}.catalog-items button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 8px;text-align:left;border:1px solid #dbe2eb;border-radius:8px;background:#f8fafc;color:#24354c;font-size:12px}.catalog-items small{font-size:10px;color:#64748b}
.object-actions[hidden]{display:none}.object-title{font-size:11px;color:#1e40af;font-weight:650;margin:0 0 5px}.object-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto 66px;gap:5px;align-items:end}.object-fields label{font-size:10px;color:#1e40af;font-weight:650;min-width:0}.object-fields input,.object-fields select{display:block;width:100%;min-width:0;margin-top:3px;padding:6px;border:1px solid #93c5fd;border-radius:7px;background:white;color:#162335;font-size:16px}.object-actions button{min-height:34px;padding:5px 8px;border:1px solid #bfdbfe;border-radius:7px;background:#fff;color:#1e40af;font:inherit;font-size:11px;font-weight:650}.object-buttons{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.object-buttons button{flex:1;padding-inline:5px}.object-buttons #objectDelete{background:#fff1f2;border-color:#fecaca;color:#b91c1c}#objectMulti.active{background:#dbeafe;border-color:#2563eb}#objectError{font-size:11px;color:#b91c1c;margin:5px 0 0}#objectError:empty{display:none}
.catalog-items button{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:7px;align-items:center}.catalog-items button img,.catalog-items button>span[aria-hidden]{grid-row:1 / 3;max-width:44px;object-fit:contain}.catalog-items button>span:not([aria-hidden]){min-width:0;font-size:11px}.catalog-items small{grid-column:2}
.menu-credit{grid-column:1 / -1;padding:7px 3px 2px;text-align:center;font-size:11px;color:#64748b}.menu-credit a{color:#24557e;text-decoration:underline}
.object-buttons #saveCustom{flex-basis:100%;min-height:30px}.custom-save-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;margin-top:6px}.custom-save-form[hidden]{display:none}.custom-save-form label{grid-column:1 / -1;font-size:11px;color:#1e40af}.custom-save-form input{min-width:0;padding:7px;border:1px solid #93c5fd;border-radius:7px;font:inherit;font-size:16px}#customMessage{font-size:11px;color:#24557e;margin:5px 0 0}#customMessage:empty{display:none}#editorFooter{max-height:45dvh;overflow:auto}
header #mainTools #eraseMode{flex:0 0 32px;width:32px;min-width:32px;height:28px;margin:0;padding:3px;border-radius:7px}#eraseMode svg{display:block;width:22px;height:22px;margin:auto}#eraseMode.active{color:#b91c1c;background:#fff1f2;border-color:#dc2626;box-shadow:inset 0 0 0 1px #dc2626}
.view-settings{grid-column:1 / -1;padding:7px 4px;border-top:1px solid #dbe2eb}.view-settings>summary{font-size:12px;padding:6px 2px;cursor:pointer}.view-settings label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 5px;font-size:12px}.view-settings input{width:18px;height:18px;accent-color:#2563eb}
.custom-entry{position:relative;min-width:0}.custom-entry>button[data-custom]{width:100%;height:100%;padding-right:38px}.custom-entry span{overflow-wrap:anywhere}.catalog-items .custom-delete{position:absolute;right:4px;top:4px;width:30px;min-height:30px;padding:5px;align-items:center;justify-content:center;border-color:#fecaca;color:#b91c1c;background:#fff1f2}
header .top-action{width:36px;height:34px;font-size:22px}header #mainTools #drawMode,header #mainTools #eraseMode{flex-basis:38px;width:38px;min-width:38px;height:34px}.object-menu>summary{width:38px;height:34px}header>.top-menu>summary{display:flex;align-items:center;justify-content:center;min-width:36px;height:34px}#viewportRotate svg{display:block;width:21px;height:21px;margin:auto}.object-library{top:max(48px,calc(env(safe-area-inset-top) + 44px))}
@media(max-width:360px){header{gap:4px;padding-inline:8px}header .top-action{width:32px}header #mainTools #drawMode,header #mainTools #eraseMode{flex-basis:34px;width:34px;min-width:34px}.object-menu>summary{width:34px}header>.top-menu>summary{min-width:32px}}
</style>
</head>
<body>
<header>
 <div id="mainTools" class="mode-row"><button id="drawMode" class="tool" aria-pressed="false" aria-label="Crtaj" title="Crtaj"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 15-1 6 6-1L21 8a2 2 0 0 0 0-3l-2-2a2 2 0 0 0-3 0L4 15Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m13 6 5 5M4 15l5 5" stroke="currentColor" stroke-width="1.8"/></svg></button><button id="eraseMode" class="tool" aria-pressed="false" aria-label="Gumica: dodirni za brisanje" title="Gumica"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 14 9-10a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 9H9l-5-5a2 2 0 0 1 0-2Z" stroke="currentColor" stroke-width="1.8"/><path d="m8 10 9 8M12 21h10" stroke="currentColor" stroke-width="1.8"/></svg></button><details id="objectMenu" class="object-menu" name="header-menu"><summary title="Dodaj element" aria-label="Dodaj namještaj, vrata, prozore ili stepenice"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 6 9-4 9 4v12l-9 4-9-4V6Zm0 0 9 4 9-4M12 10v12" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 11v6m-3-3h6" stroke="currentColor" stroke-width="1.8"/></svg></summary><div id="objectLibrary" class="object-library"></div></details></div>
 <div class="brand"><strong>CADup</strong></div>
 <button id="undo" class="top-action" title="Poništi" aria-label="Poništi">↶</button>
 <button id="redo" class="top-action" title="Vrati" aria-label="Vrati">↷</button>
 <button id="viewportRotate" class="top-action" type="button" title="Zakreni prikaz za 90°" aria-label="Zakreni prikaz za 90°"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" aria-hidden="true"><path d="M19 9a8 8 0 1 0 1 7M19 3v6h-6M8 10h6v6H8z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
 <details id="topMenu" class="top-menu" name="header-menu"><summary aria-label="Izbornik" title="Izbornik">☰</summary>
  <div class="menu-panel">
   <button id="minus" class="file-action" aria-label="Smanji zoom">− Zoom</button>
   <button id="plus" class="file-action" aria-label="Povećaj zoom">+ Zoom</button>
   <button id="fit" class="file-action">Cijelo</button>
   <button id="clearAll" class="file-action">Briši sve</button>
   <button id="saveJson" class="file-action">Spremi JSON</button>
   <button id="importJson" class="file-action">Uvezi JSON</button>
   <details class="view-settings"><summary>Postavke prikaza</summary><label><span>Neprekinuto crtanje</span><input id="continuousDrawing" type="checkbox" checked></label><label><span>Automatski puni zaslon</span><input id="autoFullscreen" type="checkbox" checked></label><label><span>Grid</span><input id="showGrid" type="checkbox" checked></label><label><span>Prikaži mjere</span><input id="showMeasures" type="checkbox" checked></label></details>
   <button id="reloadApp" class="file-action" type="button">↻ Učitaj novu verziju</button>
   <div class="menu-credit">Ante Olić · <a href="https://infoa.hr" target="_blank" rel="noopener noreferrer">INFOA</a> · Poreč<br><small class="app-version">v97</small></div>
  </div>
 </details>
 <input id="jsonFile" type="file" accept=".json,application/json" hidden>
 <div id="roomArea" hidden></div>
 <span id="status" class="status" role="status" hidden></span>
</header>
<canvas id="board" aria-label="Mreža za crtanje obrisa prostorija"></canvas>
<footer id="editorFooter" hidden>
 <div id="wallActions" class="wall-actions" hidden aria-label="Uređivanje odabranog zida">
  <form id="dimensionForm" class="dimension-fields">
   <label for="dimensionValue">Vidljivi segment zida (cm)<input id="dimensionValue" type="text" inputmode="decimal" autocomplete="off" required aria-describedby="dimensionError"></label>
   <label for="dimensionThickness">Debljina (cm)<input id="dimensionThickness" type="text" inputmode="decimal" autocomplete="off" required aria-describedby="dimensionError"></label>
  </form>
  <button id="wallDelete" type="button" style="color:#b91c1c;border-color:#fecaca;margin-top:5px">Briši</button>
  <p id="dimensionError" role="alert"></p>
 </div>
 <div id="objectActions" class="object-actions" hidden>
  <div id="objectTitle" class="object-title"></div>
  <form id="objectForm" class="object-fields">
   <label>Širina (cm)<input id="objectWidth" type="text" inputmode="decimal" required></label>
   <label>Dubina (cm)<input id="objectDepth" type="text" inputmode="decimal" required></label>
   <button id="objectMirror" type="button" title="Zrcali gore–dolje">⇅ Mirror</button>
   <button id="objectRotate" type="button" title="Zakreni odabrano za 90°">↻ +90°</button>
  </form>
  <div class="object-buttons"><button id="objectEditGroup" type="button" aria-pressed="false" hidden>Uredi grupu</button><button id="objectCopy" type="button">Dupliciraj</button><button id="objectMulti" type="button" aria-pressed="false">Više odabira</button><button id="objectGroup" type="button">Grupiraj</button><button id="objectUngroup" type="button">Razgrupiraj</button><button id="objectDelete" type="button">Obriši</button><button id="saveCustom" type="button">Spremi u biblioteku</button></div>
  <form id="customSaveForm" class="custom-save-form" hidden>
   <label for="customName">Naziv custom objekta</label><input id="customName" type="text" maxlength="60" autocomplete="off" required><button type="submit">Spremi</button>
  </form>
  <p id="customMessage" role="status"></p>
  <p id="objectError" role="alert"></p>
 </div>
</footer>
<script src="room-geometry.js?v=20261027-97"></script>
<script src="grid-geometry.js?v=20261027-97"></script>
<script src="cad-objects.js?v=20261027-97"></script>
<script src="grid-app.js?v=20261027-97"></script>
</body>
</html>
