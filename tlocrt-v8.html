<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>CADup</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#162335;background:#f8fafc;font-synthesis:none}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;min-height:0}button{font:inherit;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.3;cursor:default}button[hidden]{display:none!important}
header{flex:0 0 auto;padding:max(8px,env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid #dde4ec}
.brand{min-width:0;flex:1;line-height:1.16}.brand strong{display:block;font-size:16px;letter-spacing:-.4px}.brand span{display:block;color:#68788d;font-size:11px;margin-top:3px}
.small{height:38px;min-width:39px;border:1px solid #dde4ec;border-radius:11px;background:#f8fafc;color:#24354c;font-size:20px;font-weight:600}
canvas{display:block;flex:1;min-height:0;width:100%;background:#e9eef3;touch-action:none;outline:none;cursor:crosshair}
footer{background:#fff;border-top:1px solid #dde4ec;padding:10px 12px max(11px,env(safe-area-inset-bottom));flex:0 0 auto}
.mode-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:9px}
.tool{height:42px;border:1px solid #cbd5e1;border-radius:11px;color:#37516c;background:#f2f6fa;font-size:14px;font-weight:650}
.tool.active{background:#dbeafe;border-color:#2563eb;color:#164c91;box-shadow:inset 0 0 0 1px #2563eb}
.statusline{min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px}
.status{font-size:12px;font-weight:600;color:#2e4c6c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secondary{font-size:12px;color:#66788e;margin-bottom:7px}.cancel{border:0;color:#1d5da5;background:#eff6ff;border-radius:8px;padding:7px 9px;font-size:12px;font-weight:650;white-space:nowrap}
.controls{display:flex;gap:6px}.controls button{height:40px;border:1px solid #dbe2eb;border-radius:10px;background:#f2f6fb;color:#1a456d;font-size:12px;font-weight:650;padding:0 12px}
#toggleWalls{margin-right:auto;min-width:44px;padding:0 9px;display:flex;align-items:center;justify-content:center;color:#15803d;background:#ecfdf5;border-color:#22c55e}
#toggleWalls svg{width:26px;height:26px;display:block}#toggleWalls .wall-off{display:none}
#toggleWalls[aria-pressed="false"]{color:#94a3b8;background:#f1f5f9;border-color:#ef4444}
#toggleWalls[aria-pressed="false"] .wall-off{display:block;stroke:#dc2626}#minus,#plus{font-size:21px;min-width:40px;padding:0}#clearAll{color:#a52835;background:#fff1f2}#clearAll.armed{color:#fff;background:#b91c1c}
@media(max-width:360px){header{padding-inline:8px}.brand span{font-size:9px}footer{padding-inline:8px}.controls{gap:4px}.controls button{padding-inline:8px}.tool{font-size:12px}}
header{flex-wrap:nowrap;padding:4px 10px;min-height:36px;gap:6px;position:relative;z-index:10}.brand strong{font-size:13px}
.top-menu{position:relative;flex:none}.top-menu summary{font-size:12px;font-weight:650;cursor:pointer;list-style:none;padding:6px 8px;border:1px solid #cbd5e1;border-radius:7px;background:#f2f6fb}.top-menu summary::-webkit-details-marker{display:none}
.menu-panel{position:absolute;right:0;top:calc(100% + 6px);display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(280px,calc(100vw - 20px));padding:8px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 8px 24px #16233526}
.file-action{min-height:38px;padding:6px 9px;border:1px solid #cbd5e1;border-radius:9px;background:#f2f6fb;color:#1a456d;font-size:12px;font-weight:650}
header #toggleWalls{margin:0;width:32px;height:28px;min-width:32px;border:1px solid #22c55e;border-radius:7px;padding:2px 4px}header #toggleWalls svg{width:22px;height:22px}header{padding-top:max(4px,env(safe-area-inset-top))}
footer{padding:5px 8px max(5px,env(safe-area-inset-bottom))}.mode-row{display:flex;gap:6px;margin:0}.mode-row .tool{flex:1;height:36px;border-radius:8px}
.mode-row #toggleWalls{margin:0;flex:0 0 38px;min-width:38px;height:36px;padding:4px;border:1px solid #22c55e;border-radius:8px}.mode-row #drawMode{flex:0 0 38px}.mode-row #drawMode svg{display:block;width:22px;height:22px;margin:auto}.cancel{padding:5px 9px}.cancel[hidden]{display:none}.status{display:block;margin-top:4px}.status[hidden]{display:none}
.top-action{flex:none;width:30px;height:28px;padding:0;border:1px solid #cbd5e1;border-radius:7px;background:#f2f6fb;color:#24354c;font-size:20px}

.wall-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:5px;margin-bottom:6px;padding:6px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:10px}.wall-actions[hidden]{display:none}.wall-actions button{min-height:36px;padding:5px 7px;border:1px solid #bfdbfe;background:#fff;border-radius:7px;color:#1e40af;font:inherit;font-size:11px;font-weight:650}#wallDelete{color:#b91c1c;border-color:#fecaca;background:#fff1f2}
.wall-actions{display:block;padding:6px}.dimension-fields{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) 30px;gap:5px;align-items:end}.dimension-fields label{font-size:10px;font-weight:650;color:#1e40af;min-width:0}.dimension-fields input{display:block;width:100%;min-width:0;margin-top:3px;padding:7px 5px;border:1px solid #93c5fd;border-radius:7px;background:#fff;color:#162335;font:inherit;font-size:16px}.dimension-fields button{padding-inline:6px}#dimensionError{margin:5px 0 0;font-size:11px;color:#b91c1c}#dimensionError:empty{display:none}
.mode-row[hidden]{display:none}.wall-actions{margin-bottom:0}
.footer-row{display:flex;align-items:flex-end;gap:6px}.footer-row .mode-row{flex:0 0 auto}.footer-row .wall-actions{flex:1;min-width:0}.footer-row .dimension-fields{gap:3px;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) 28px}.footer-row .dimension-fields label{font-size:9px}.footer-row .dimension-fields button{padding-inline:4px}.footer-row .wall-actions{padding:4px}
header{flex-wrap:wrap}header #mainTools{display:flex;flex:0 0 auto;gap:4px;margin:0}header #mainTools #toggleWalls,header #mainTools #drawMode{flex:0 0 32px;width:32px;min-width:32px;height:28px;margin:0;padding:3px;border-radius:7px}header #mainTools svg{width:22px;height:22px}header .wall-actions{flex:0 0 100%;min-width:0;margin:0;padding:4px}.top-menu summary{padding:5px 8px}header .status{flex:0 0 100%;margin:0}
.menu-panel #reloadApp{grid-column:1 / -1}
</style>
</head>
<body>
<header>
 <div class="brand"><strong>CADup</strong></div>
 <div id="mainTools" class="mode-row"><button id="toggleWalls" aria-label="Sakrij zidove" aria-pressed="true" title="Zidovi uključeni"><svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M4 24V4h20v20h-7v-4h3V8H8v12h4v4H4Z" fill="currentColor"/><path d="M14 8v5h6M8 16h6v4" stroke="currentColor" stroke-width="3"/><path class="wall-off" d="M3 3l22 22" stroke-width="2.5" stroke-linecap="round"/></svg></button><button id="drawMode" class="tool" aria-pressed="false" aria-label="Crtaj" title="Crtaj"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 15-1 6 6-1L21 8a2 2 0 0 0 0-3l-2-2a2 2 0 0 0-3 0L4 15Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m13 6 5 5M4 15l5 5" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
 <button id="undo" class="top-action" title="Poništi" aria-label="Poništi">↶</button>
 <button id="redo" class="top-action" title="Vrati" aria-label="Vrati">↷</button>
 <button id="fullscreen" class="top-action" title="Cijeli zaslon" aria-label="Cijeli zaslon">⛶</button>
 <details id="topMenu" class="top-menu"><summary aria-label="Izbornik" title="Izbornik">☰</summary>
  <div class="menu-panel">
   <button id="reloadApp" class="file-action" type="button">↻ Učitaj novu verziju</button>
   <button id="minus" class="file-action" aria-label="Smanji zoom">− Zoom</button>
   <button id="plus" class="file-action" aria-label="Povećaj zoom">+ Zoom</button>
   <button id="fit" class="file-action">Cijelo</button>
   <button id="clearAll" class="file-action">Briši sve</button>
   <button id="saveJson" class="file-action">Spremi JSON</button>
   <button id="importJson" class="file-action">Uvezi JSON</button>
  </div>
 </details>
 <input id="jsonFile" type="file" accept=".json,application/json" hidden>
 <div id="wallActions" class="wall-actions" hidden aria-label="Uređivanje odabranog zida">
  <form id="dimensionForm" class="dimension-fields">
   <button id="wallDelete" type="button" title="Obriši odabrani zid">Obriši</button>
   <label for="dimensionValue">Duljina (cm)<input id="dimensionValue" type="text" inputmode="decimal" autocomplete="off" required aria-describedby="dimensionError"></label>
   <label for="dimensionThickness">Debljina (cm)<input id="dimensionThickness" type="text" inputmode="decimal" autocomplete="off" required aria-describedby="dimensionError"></label>
   <button type="submit" title="Primijeni mjere" aria-label="Primijeni mjere">✓</button>
  </form>
  <p id="dimensionError" role="alert"></p>
 </div>
 <div id="roomArea" hidden></div>
 <span id="status" class="status" role="status" hidden></span>
</header>
<canvas id="board" aria-label="Mreža za crtanje obrisa prostorija"></canvas>
<script src="room-geometry.js?v=20261027-40"></script>
<script src="grid-geometry.js?v=20261027-40"></script>
<script src="grid-app.js?v=20261027-40"></script>
</body>
</html>
